name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: travel_platform_test
          POSTGRES_USER: travel_test
          POSTGRES_PASSWORD: travel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_test -d travel_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CI: true
      DATABASE_TEST_MODE: ci
      DATABASE_TEST_HOST: 127.0.0.1
      DATABASE_TEST_PORT: 5432
      DATABASE_TEST_NAME: travel_platform_test
      DATABASE_TEST_USER: travel_test
      DATABASE_TEST_PASSWORD: travel_test_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: npm run secrets:scan

      - name: Dependency audit
        run: npm run security:check

      - name: Validate migration file naming
        run: npm run migrations:validate

      - name: Unit tests
        run: npm run test

      - name: Security tests
        run: npm run test:security

      - name: Database and RLS integration tests
        run: npm run test:db

      - name: Build
        run: npm run build
