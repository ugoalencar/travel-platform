# Travel Lite — local stack para a agência piloto.
#
# Serviços finais: postgres + api-lite (a API serve o frontend já buildado,
# um único endereço no navegador). Levante com scripts/travel-lite-start.ps1.
#
# IMPORTANTE: banco dedicado do Travel Lite. Nunca aponte para o banco
# principal da Travel Platform.

services:
  postgres:
    image: postgres:17
    container_name: travel-lite-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:55436:5432"
    environment:
      POSTGRES_DB: travel_lite
      POSTGRES_USER: travel_lite_admin
      POSTGRES_PASSWORD: ${TRAVEL_LITE_DB_PASSWORD:-travel_lite_admin_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_lite_admin -d travel_lite"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - travel_lite_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.travel-lite
    container_name: travel-lite-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4010:4010"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4010"
      DATABASE_URL: postgresql://travel_lite_runtime:${TRAVEL_LITE_RUNTIME_DB_PASSWORD:-travel_lite_runtime_password}@postgres:5432/travel_lite
      FRONTEND_DIST_DIR: /app/apps/travel-lite/dist
      TRAVEL_LITE_CORS_ORIGINS: ${TRAVEL_LITE_CORS_ORIGINS:-http://127.0.0.1:4010,http://localhost:4010}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4010/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  travel_lite_postgres_data:
