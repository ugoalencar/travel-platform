        currency: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string }
        paidAmount: { type: number, format: float }
        createdAt: { type: string, format: date-time }

    CreatePayableInput:
      type: object
      required: [supplierId, tripId, amount, dueDate]
      properties:
