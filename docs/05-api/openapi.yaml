openapi: 3.1.0
info:
  title: Travel Platform API
  version: 0.1.0
  description: |
    Multi-tenant travel agency platform API.

    ## Authentication
    All authenticated endpoints require a valid JWT token via `Authorization: Bearer <token>` header
    or `token=<jwt>` cookie.

    JWT payload: `sub` (user id), `agency_id` (tenant id), `role` (UserRole), `email`.

    ## Tenant Isolation
    Every request is scoped to the tenant derived from the JWT. Resources are never shared across tenants.

    ## RBAC Roles (hierarchical)
    OWNER > ADMIN > MANAGER > AGENT > VIEWER

    ## Error Format
    ```json
    { "error": "message", "code": "ERROR_CODE", "details": {} }
    ```

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Infrastructure
    description: Health, version, metrics, tenant verification
  - name: Settings
    description: Agency profile, team, departments, invitations, permissions
  - name: Customers
    description: Customer CRM and sub-resources
  - name: Wishes
    description: Customer travel wishes
  - name: Proposals
    description: Commercial proposals and offers
  - name: Trips & Bookings
    description: Trips, bookings, air/land services
  - name: Sales
    description: Sales lifecycle
  - name: Financial
    description: Receivables, payables, payments, revenues, expenses, cash, DRE
  - name: Commercial Cockpit
    description: Opportunities, tasks, interactions, pipelines, reports
  - name: Documents
    description: Customer documents, attachments, OCR, verification
  - name: Transport
    description: Routes, suppliers, products, departures, agenda
  - name: Operations
    description: Trip occurrences, post-trip, operational staff
  - name: Reports
    description: Management and financial reports
  - name: Pescador
    description: External offer capture
  - name: Enrollment
    description: Customer enrollment links and submissions
  - name: Customer Portal
    description: Read-only customer-facing API
  - name: Support
    description: Agency support tickets
  - name: Platform
    description: Cost centers, commissions, employees, payroll, automations, campaigns, coupons, connectors, assets, publications, engagements

paths:
