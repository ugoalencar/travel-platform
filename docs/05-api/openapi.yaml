        id: { type: string }
        tripId: { type: string }
        customerId: { type: string }
        type: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string }

    CreateLandServiceInput:
      type: object
      required: [tripId, type]
      properties:
        tripId: { type: string }
        customerId: { type: string }
        type: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    UpdateLandServiceInput:
      type: object
      properties:
        type: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string }

    Sale:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        tripId: { type: string }
        totalAmount: { type: number, format: float }
