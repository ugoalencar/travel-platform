          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
                  service: { type: string, enum: [api] }
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [not_ready] }
                  service: { type: string, enum: [api] }

  /me:
