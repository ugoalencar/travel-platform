  # INFRASTRUCTURE
  # ============================================================
  /health:
    get:
      tags: [Infrastructure]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string, enum: [api] }

  /version:
    get:
      tags: [Infrastructure]
      summary: Build version info
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Version information

  /metrics:
    get:
      tags: [Infrastructure]
      summary: Runtime metrics snapshot
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Metrics including db pool stats

