        id: { type: string }
        proposalId: { type: string }
        status: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }

    OfferItem:
      type: object
      properties:
        id: { type: string }
        offerId: { type: string }
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: float }

    CreateOfferInput:
      type: object
      required: [proposalId, items]
      properties:
        proposalId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OfferItemInput' } }

    OfferItemInput:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: float }

    UpdateOfferInput:
      type: object
      properties:
        status: { type: string }

    # ---- Financial Schemas ----
    Receivable:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        tripId: { type: string }
        amount: { type: number, format: float }
        currency: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string }
        paidAmount: { type: number, format: float }
        createdAt: { type: string, format: date-time }

    CreateReceivableInput:
      type: object
