# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- Enums ----
    UserRole:
      type: string
      enum: [OWNER, ADMIN, MANAGER, AGENT, VIEWER]

    TripType:
      type: string
      enum: [CUSTOM, GROUP, CRUISE, CHARTER, HONEYMOON, BUSINESS]

    CampaignStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, CLOSED]

    PublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    AutomationStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, ERROR]

    # ---- Common ----
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        details: { type: object }

    # ---- Core Domain ----
    Agency:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: string }
        createdAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        departmentId: { type: string }
        createdAt: { type: string, format: date-time }

    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        cpf: { type: string }
        createdAt: { type: string, format: date-time }

    CreateCustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        cpf: { type: string }

    UpdateCustomerInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        cpf: { type: string }

    Wish:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        destination: { type: string }
        travelDates: { type: string }
        tripType: { $ref: '#/components/schemas/TripType' }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    CreateWishInput:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string }
        destination: { type: string }
        travelDates: { type: string }
        tripType: { $ref: '#/components/schemas/TripType' }

    UpdateWishInput:
      type: object
      properties:
        destination: { type: string }
        travelDates: { type: string }
        tripType: { $ref: '#/components/schemas/TripType' }
        status: { type: string }

    Trip:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        wishId: { type: string }
        name: { type: string }
        tripType: { $ref: '#/components/schemas/TripType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    CreateTripInput:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string }
        wishId: { type: string }
        name: { type: string }
        tripType: { $ref: '#/components/schemas/TripType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    UpdateTripInput:
      type: object
      properties:
        name: { type: string }
        tripType: { $ref: '#/components/schemas/TripType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string }

    Booking:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        status: { type: string }
        totalAmount: { type: number, format: float }
        currency: { type: string }
        createdAt: { type: string, format: date-time }

    CreateBookingInput:
      type: object
      required: [tripId]
      properties:
        tripId: { type: string }
        totalAmount: { type: number, format: float }
        currency: { type: string }

    BookingPassenger:
      type: object
      properties:
        id: { type: string }
        bookingId: { type: string }
        name: { type: string }
        document: { type: string }

    AirService:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        customerId: { type: string }
        carrier: { type: string }
        flightNumber: { type: string }
        departure: { type: string }
        arrival: { type: string }
        status: { type: string }

    CreateAirServiceInput:
      type: object
      required: [tripId]
      properties:
        tripId: { type: string }
        customerId: { type: string }
        carrier: { type: string }
        flightNumber: { type: string }
        departure: { type: string }
        arrival: { type: string }

    UpdateAirServiceInput:
