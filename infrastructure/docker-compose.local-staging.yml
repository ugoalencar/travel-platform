# Local staging simulation (Track B, "run it locally before Vercel/Supabase").
# Reproduces the real target shape as closely as possible on this machine:
# a real Postgres role that satisfies assertSafeDatabaseRole() (non-superuser,
# NOBYPASSRLS -- same constraint a real Supabase runtime role must satisfy),
# a real Redis backing RATE_LIMIT_STORE=external, the API running with
# NODE_ENV=production (so every fail-closed gate in env.ts/security-config.ts
# actually engages, unlike the Dockerfile's own NODE_ENV=staging default --
# see docs/deployment/STAGING_DEPLOY_RUNBOOK.md), and Caddy terminating real
# HTTPS (self-signed local CA) in front of the 4 static frontend builds plus
# the API, on distinct *.localhost hostnames (RFC 6761 -- resolves to
# loopback with no /etc/hosts edit needed) so CORS is exercised
# cross-origin exactly like the real Vercel/Node-host split.
#
# Distinct container/network names and ports from
# docker-compose.local-postgres.yml (used by the test suite) so this can run
# alongside tests without collision.

services:
  postgres-staging:
    image: postgres:15
    container_name: travel-platform-postgres-staging
    restart: "no"
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_DB: travel_platform_staging
      POSTGRES_USER: travel_staging_admin
      POSTGRES_PASSWORD: travel_staging_admin_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_staging_admin -d travel_platform_staging"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - travel_platform_postgres_staging_data:/var/lib/postgresql/data

  redis-staging:
    image: redis:7-alpine
    container_name: travel-platform-redis-staging
    restart: "no"
    ports:
      - "127.0.0.1:63900:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-staging:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: travel-platform-api-staging
    restart: "no"
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    ports:
      - "127.0.0.1:4001:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://travel_app_runtime_local:travel_app_runtime_local_password@postgres-staging:5432/travel_platform_staging
      RATE_LIMIT_STORE: external
      REDIS_URL: redis://redis-staging:6379/0
      CORS_ALLOWED_ORIGINS: https://agency.localhost,https://portal.localhost,https://admin.localhost,https://www.localhost
      UPLOADS_DIR: /app/uploads
      # Real values injected via shell env at `docker compose up` time
      # (RESEND_API_KEY=... docker compose ...) -- never written to this
      # file. See docs/operations/EMAIL_PROVIDER_RESEND.md.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
    volumes:
      - api_staging_uploads:/app/uploads

  caddy-staging:
    image: caddy:2-alpine
    container_name: travel-platform-caddy-staging
    restart: "no"
    depends_on:
      - api-staging
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../infrastructure/Caddyfile.local-staging:/etc/caddy/Caddyfile:ro
      - ../apps/agency/dist:/srv/agency:ro
      - ../apps/customer/dist:/srv/customer:ro
      - ../apps/platform-admin/dist:/srv/platform-admin:ro
      - ../apps/marketing/dist:/srv/marketing:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config

volumes:
  travel_platform_postgres_staging_data:
  caddy_staging_data:
  caddy_staging_config:
  api_staging_uploads:
